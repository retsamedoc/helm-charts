remote: origin
target-branch: main
helm-extra-args: --timeout 600s
chart-dirs:
  - charts
# Install only charts that are smoke-testable in k3d.
# weatherflow2mqtt remains excluded until its values use the controllers API
# (template already on common 4.x). esphome/retrom/romm render on common 4.x
# but stay excluded until install CI values are hardened for real app startup.
excluded-charts:
  - esphome
  - retrom
  - romm
  - weatherflow2mqtt
chart-repos:
  - bitnami=https://charts.bitnami.com/bitnami
  - library=https://bjw-s-labs.github.io/helm-charts
  - retsamedoc=https://retsamedoc.github.io/helm-charts
  - jetstack=https://charts.jetstack.io
