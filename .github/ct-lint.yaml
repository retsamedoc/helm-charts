remote: origin
target-branch: main
helm-extra-args: --timeout 600s
# All charts use YY.M.r. Require a SemVer bump on changes.
check-version-increment: true
chart-dirs:
  - charts
excluded-charts:
chart-repos:
  - bitnami=https://charts.bitnami.com/bitnami
  - retsamedoc=https://retsamedoc.github.io/helm-charts
  - jetstack=https://charts.jetstack.io
