#
# IMPORTANT NOTE
#
# This chart inherits from our common library chart. You can check the default values/options here:
# https://github.com/retsamedoc/helm-charts/blob/main/charts/common/values.yaml
#

controllers:
  main:
    strategy: Recreate
    containers:
      main:
        image:
          # -- image repository
          repository: linuxserver/deluge
          # -- image tag
          tag: 2.2.0
          # -- image pull policy
          pullPolicy: IfNotPresent

        # -- environment variables.
        # @default -- See below
        env:
          # -- Set the container timezone
          TZ: UTC
          # -- User ID the application will run as
          PUID: "1000"
          # -- Group ID the application will run as
          PGID: "1000"
          # -- Log level for deluged (none, info, warning, error, debug)
          DELUGE_LOGLEVEL: error
          # UMASK: "022"

# -- Configures service settings for the chart.
# @default -- See values.yaml
service:
  main:
    controller: main
    ports:
      http:
        port: 8112
      bittorrent:
        port: 6881
        protocol: TCP
      bittorrent-udp:
        port: 6881
        protocol: UDP
      # Thin-client port for deluged. Enable if you connect a remote client.
      daemon:
        enabled: false
        port: 58846

ingress:
  # -- Enable and configure ingress settings for the chart under this key.
  # @default -- See values.yaml
  main:
    enabled: false
    hosts:
      - host: deluge.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - hosts:
          - deluge.local
        secretName: tls-deluge-ingress

# -- Configure persistence settings for the chart under this key.
# @default -- See values.yaml
persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /config
  downloads:
    enabled: false
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 10Gi
    globalMounts:
      - path: /downloads
