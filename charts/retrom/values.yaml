#
# IMPORTANT NOTE
#
# This chart inherits from our common library chart. You can check the default values/options here:
# https://github.com/retsamedoc/helm-charts/blob/main/charts/common/values.yaml
#

controllers:
  main:
    containers:
      main:
        image:
          # -- image repository
          repository: ghcr.io/jmberesford/retrom-service
          # -- image tag
          tag: v0.8.4
          # -- image pull policy
          pullPolicy: IfNotPresent

        # -- environment variables.
        # @default -- See below
        env:
          # -- Set the container timezone
          TZ: UTC
          # PUID: 1000
          # PGID: 1000
          # Skip recursive chown on large libraries (recommended on k3s local-path).
          # SKIP_RECURSIVE_CHOWN: "true"

          # Embedded Postgres is the default. Uncomment to use an external database.
          # POSTGRES_HOST: ""
          # POSTGRES_PORT: "5432"
          # POSTGRES_USER: ""
          # POSTGRES_PASSWORD: ""
          # POSTGRES_DB: ""

# -- Configures service settings for the chart. Normally this does not need to be modified.
# @default -- See values.yaml
service:
  main:
    controller: main
    ports:
      http:
        port: 5101

ingress:
  # -- Enable and configure ingress settings for the chart under this key.
  # @default -- See values.yaml
  main:
    enabled: false
    hosts:
      - host: retrom.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - hosts:
          - retrom.local
        secretName: tls-retrom-ingress

# -- Configure persistence settings for the chart under this key.
# @default -- See values.yaml
persistence:
  config:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /app/config
  data:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /app/data
  library:
    enabled: false
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 10Gi
    globalMounts:
      - path: /app/library
