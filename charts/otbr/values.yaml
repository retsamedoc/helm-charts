#
# IMPORTANT NOTE
#
# This chart inherits from our common library chart. You can check the default values/options here:
# https://github.com/retsamedoc/helm-charts/blob/main/charts/common/values.yaml
#
# This is not a zero-config app. A default install does not form a Thread network.
# hostNetwork is false and no radio is mounted so `helm lint` / `helm template`
# succeed without a host device. A working border router needs the commented
# settings below, on the k3s node that has the radio coprocessor.
#
# LAN attachment (pick one: hostNetwork, macvlan, or ipvlan), then uncomment:
#   controllers.main.pod.hostNetwork: true
#   NET_ADMIN (and usually NET_RAW), or privileged
#   persistence.rcp + persistence.tun
#   OT_RCP_DEVICE and OT_INFRA_IF matching that node
#   persistence.data enabled
#
# Official image: openthread/border-router (Docker Hub). Pin is v2026.09.0
# (same digest as the `stable` tag). `latest` and `main` float and are not used.
#

controllers:
  main:
    strategy: Recreate

    pod:
      # -- Use the node network namespace. One of ipvlan, macvlan, or hostNetwork
      # is required for a working border router. Default false so the chart renders without a radio.
      hostNetwork: false
      # Pin the pod to the node that owns the RCP. Prefer a USB feature label
      # over a hostname. 10c4:ea60 is a Silicon Labs CP210x (often /dev/ttyUSB0):
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #             - key: feature.node.kubernetes.io/usb-ff_10c4_ea60.present
      #               operator: In
      #               values:
      #                 - "true"
      #
      # Official docker setup writes forwarding/RA sysctls on the host
      # (`etc/docker/border-router/setup-host`), not in the container. The common
      # library can set pod securityContext.sysctls, but these are unsafe and
      # interface-specific, and k3s will reject them unless the kubelet allowlists
      # them. Prefer the host script. Do not enable this block for CI.
      # securityContext:
      #   sysctls:
      #     - name: net.ipv4.ip_forward
      #       value: "1"
      #     - name: net.ipv6.conf.all.forwarding
      #       value: "1"

    containers:
      main:
        image:
          # -- image repository
          repository: openthread/border-router
          # -- image pull policy
          pullPolicy: IfNotPresent
          # -- image tag
          tag: "v2026.09.0"

        # -- environment variables.
        # @default -- See below
        env:
          # -- Set the container timezone
          TZ: UTC

          # Radio URL. The path must match persistence.rcp. Image default if unset:
          # spinel+hdlc+uart:///dev/ttyACM0?uart-baudrate=1000000
          # Silicon Labs CP210x sticks usually enumerate as /dev/ttyUSB0.
          # OT_RCP_DEVICE: "spinel+hdlc+uart:///dev/ttyUSB0?uart-baudrate=1000000"

          # Backbone / infrastructure interface on the scheduled k3s node.
          # The official container reads OT_INFRA_IF (image default wlan0).
          # Native setup uses INFRA_IF_NAME; some third-party images use BACKBONE_INTERFACE.
          # This image does not read BACKBONE_INTERFACE. Must be a real NIC on that node
          # (often eth0 on k3s appliances, not the Thread interface wpan0).
          # OT_INFRA_IF: eth0

          # Thread TUN interface created by otbr-agent. Image default: wpan0
          # OT_THREAD_IF: wpan0

          # OT_LOG_LEVEL: "7"

          # Web UI. Image defaults bind 127.0.0.1:8080, so port-forward works and a
          # ClusterIP Service does not. Set 0.0.0.0 to publish on the node with hostNetwork.
          # OT_WEB_LISTEN_ADDR: "0.0.0.0"
          # OT_WEB_LISTEN_PORT: "8080"

          # REST API. The web UI topology client calls this host on port 8081.
          # OT_REST_LISTEN_ADDR: "127.0.0.1"
          # OT_REST_LISTEN_PORT: "8081"

        # Official `docker run` uses --cap-add=NET_ADMIN and --device for the RCP and
        # /dev/net/tun. Privileged is a fallback when the runtime will not grant those
        # device nodes. Leave commented until the radio is attached; do not enable for CI.
        # securityContext:
        #   privileged: true
        #   capabilities:
        #     add:
        #       - NET_ADMIN
        #       - NET_RAW

# -- Configures service settings for the chart.
# Unused in the supported hostNetwork mode; kept for non-hostNetwork experiments.
# @default -- See values.yaml
service:
  main:
    controller: main
    ports:
      web:
        port: 8080
        targetPort: 8080
      rest:
        port: 8081
        targetPort: 8081

# -- Configure persistence settings for the chart under this key.
# @default -- See values.yaml
persistence:
  # Thread dataset. The image does `mkdir -p /data/thread` and symlinks
  # /var/lib/thread -> /data/thread. Mount the volume at /data (official docker
  # bind is /var/lib/otbr:/data). Disabled by default so install does not require storage.
  data:
    enabled: false
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /data

  # RCP serial device. hostPath + CharDevice is how the common library mounts host devices.
  # Path must match OT_RCP_DEVICE. globalMounts is required; hostPath alone is not a mount.
  # rcp:
  #   enabled: true
  #   type: hostPath
  #   hostPath: /dev/ttyUSB0
  #   hostPathType: CharDevice
  #   globalMounts:
  #     - path: /dev/ttyUSB0

  # TUN device used to create the Thread interface (wpan0).
  # tun:
  #   enabled: true
  #   type: hostPath
  #   hostPath: /dev/net/tun
  #   hostPathType: CharDevice
  #   globalMounts:
  #     - path: /dev/net/tun
