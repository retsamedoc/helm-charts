# Minimal overrides for chart-testing install.
# The app needs a real database; sleep so CI validates render + deploy.
controllers:
  main:
    containers:
      main:
        command:
          - sleep
          - infinity
        env:
          TZ: UTC
          DB_HOST: localhost
          DB_NAME: romm
          DB_USER: romm
          DB_PASSWD: ci-password
          ROMM_AUTH_SECRET_KEY: ci-secret
persistence:
  assets:
    enabled: false
  config:
    enabled: false
  library:
    enabled: false
  resources:
    enabled: false
  redis:
    enabled: false
ingress:
  main:
    enabled: false
