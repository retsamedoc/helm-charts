#
# IMPORTANT NOTE
#
# This chart inherits from our common library chart. You can check the default values/options here:
# https://github.com/retsamedoc/helm-charts/blob/main/charts/common/values.yaml
#

controllers:
  main:
    containers:
      main:
        image:
          # -- image repository
          repository: ghcr.io/rommapp/romm
          # -- image tag
          tag: 5.2.0
          # -- image pull policy
          pullPolicy: IfNotPresent

        # -- environment variables.
        # @default -- See below
        env:
          ROMM_BASE_PATH: /romm
          # -- Set the container timezone
          TZ: UTC

          # External database, or leave unset and enable the optional MariaDB subchart.
          # When mariadb.enabled is true these are overridden from that subchart.
          # ROMM_DB_DRIVER: mariadb
          DB_HOST: ""
          DB_PORT: "3306"
          DB_NAME: romm
          DB_USER: ""
          DB_PASSWD: ""

          # Internal Valkey listens on 127.0.0.1 unless you point these at an external instance.
          # REDIS_HOST: 127.0.0.1
          # REDIS_PORT: "6379"
          # REDIS_PASSWORD: ""

          # Required. openssl rand -hex 32
          # Prefer a Secret:
          # ROMM_AUTH_SECRET_KEY:
          #   secretKeyRef:
          #     name: romm-auth
          #     key: ROMM_AUTH_SECRET_KEY
          ROMM_AUTH_SECRET_KEY: ""

          # Metadata providers (optional but recommended before the first scan)
          # IGDB_CLIENT_ID: ""
          # IGDB_CLIENT_SECRET: ""
          # SCREENSCRAPER_USER: ""
          # SCREENSCRAPER_PASSWORD: ""
          # STEAMGRIDDB_API_KEY: ""
          # RETROACHIEVEMENTS_API_KEY: ""
          # MOBYGAMES_API_KEY: ""
          # HASHEOUS_API_ENABLED: true

          # DISABLE_EMULATOR_JS: false
          # DISABLE_RUFFLE_RS: false
          # DISABLE_CSRF_PROTECTION: false
          # DISABLE_DOWNLOAD_ENDPOINT_AUTH: false

# -- Configures service settings for the chart. Normally this does not need to be modified.
# @default -- See values.yaml
service:
  main:
    controller: main
    ports:
      http:
        port: 8080

ingress:
  # -- Enable and configure ingress settings for the chart under this key.
  # @default -- See values.yaml
  main:
    enabled: false
    hosts:
      - host: romm.local
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls:
      - hosts:
          - romm.local
        secretName: tls-romm-ingress

# -- Configure persistence settings for the chart under this key.
# @default -- See values.yaml
persistence:
  assets:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /romm/assets
  config:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /romm/config
  library:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 10Gi
    globalMounts:
      - path: /romm/library
  resources:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /romm/resources
  redis:
    enabled: true
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 1Gi
    globalMounts:
      - path: /redis-data

# Optional bundled MariaDB. Leave disabled to use an external database.
mariadb:
  enabled: false
  auth:
    database: romm
    username: romm
    # Set both before enabling, or leave password empty and let the subchart generate it.
    password: ""
    rootPassword: ""
  primary:
    persistence:
      size: 8Gi
